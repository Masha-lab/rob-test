name: ROB Test Multi-Arch

on: [push, workflow_dispatch]

jobs:
  # x86 сервер (Intel Xeon)
  test-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Compile
        run: g++ -O3 -o lab10 lab10.cpp
      - name: Run
        run: ./lab10 > results_x86.csv
      - name: Show results
        run: cat results_x86.csv
      - uses: actions/upload-artifact@v4
        with:
          name: results-x86
          path: results_x86.csv

  # ARM сервер (Apple M1/M2)
  test-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile for ARM
        run: g++ -O3 -o lab10_arm lab10_arm.cpp
      - name: Run
        run: ./lab10_arm > results_arm.csv
      - name: Show results
        run: cat results_arm.csv
      - uses: actions/upload-artifact@v4
        with:
          name: results-arm
          path: results_arm.csv
